name: Increment Version

on:
    workflow_dispatch:
      inputs:
        name:
          description: 'Automated version increment'
          required: false
          default: ''

jobs:
    increment-version:
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.x'

            - name: Prepare git branch
              run: |
                git config --local user.email "github-actions[bot]@users.noreply.github.com"
                git config --local user.name "github-actions[bot]"
                git fetch --all
                git checkout dev
                git pull

            - name: Increment version
              ## NOTE: bumps face_rhythm/_version.py (the single source of truth
              ## that pyproject.toml reads via `attr = "face_rhythm._version.__version__"`).
              run: python .github/scripts/increment_version.py --path face_rhythm/_version.py

            - name: Commit changes
              run: |
                git status
                git add face_rhythm/_version.py
                git commit -m "Increment version number"
                git push
