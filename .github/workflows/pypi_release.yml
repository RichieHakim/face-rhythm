name: Publish Python distribution to PyPI

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'description'
        required: false
        default: ''

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pypa/build
      run: python3 -m pip install --upgrade build

    - name: Build a binary wheel and a source tarball
      ## Uses pyproject.toml (PEP 517/518) — no setup.py required.
      run: python3 -m build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/face-rhythm
    permissions:
      id-token: write  ## mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign with Sigstore and publish a GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  ## needed to create a GitHub Release
      id-token: write  ## needed for sigstore

    steps:
    - uses: actions/checkout@v4

    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Store the version number
      ## Reads from face_rhythm/_version.py (the single source of truth driven
      ## by increment_version.py and consumed by pyproject.toml via `attr =
      ## "face_rhythm._version.__version__"`).
      run: |
        version=$(grep '__version__' ${{ github.workspace }}/face_rhythm/_version.py | awk -F = '{print $2}' | tr -d ' ' | tr -d \"\')
        echo "VERSION=$version" >> $GITHUB_ENV

    - name: Check version number
      run: echo "Version is $VERSION"

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create "v$VERSION"
        --title "v$VERSION"
        --notes "Release for version $VERSION. Also available on PyPI: https://pypi.org/project/face-rhythm/$VERSION/"
        --repo ${{ github.repository }}
