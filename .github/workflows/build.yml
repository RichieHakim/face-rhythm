name: build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "release", "dev" ]
  workflow_dispatch:
    inputs:
      name:
        description: 'description'
        required: false
        default: ''

permissions:
  contents: read

jobs:

  test:

    name: test ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:

    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        ## Cache pip wheels keyed on pyproject.toml so matrix jobs share warm caches.
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Report machine info (Linux)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        echo "--- lscpu ---"
        lscpu || true
        echo "--- free -h ---"
        free -h || true
        echo "--- df -h ---"
        df -h || true
        echo "--- uname -a ---"
        uname -a

    - name: Report machine info (macOS)
      if: startsWith(matrix.platform, 'macos')
      run: |
        echo "--- cpu ---"
        sysctl -n machdep.cpu.brand_string || true
        echo "--- memory ---"
        sysctl -n hw.memsize || true
        echo "--- df -h ---"
        df -h || true
        echo "--- uname -a ---"
        uname -a

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install package with dev extras
      run: |
        ## Dev extra (from pyproject.toml) pulls pytest + pytest-cov.
        pip install -v -e ".[dev]"

    - name: Report installed packages
      run: |
        pip list
        python -c "import torch; print(f'torch=={torch.__version__}'); print('cuda:', torch.cuda.is_available())"

    - name: Run pytest
      run: |
        pytest -x -v tests/ --cov=face_rhythm --cov-report=term-missing --color=yes
