name: docs

on:
  push:
    branches: [ "dev", "release" ]
  pull_request:
    branches: [ "dev", "release" ]
  workflow_dispatch:
    inputs:
      name:
        description: 'description'
        required: false
        default: ''

permissions:
  contents: read

jobs:

  sphinx-build:
    name: Sphinx build (html)
    runs-on: ubuntu-latest
    ## Docs are being overhauled in parallel; don't gate PRs on a doc build yet.
    ## Flip this to false once the docs rewrite lands.
    continue-on-error: true

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install package with docs extras
      ## [docs] pulls sphinx + sphinx_rtd_theme + myst-parser.
      ## Install the project too so autodoc can import face_rhythm modules.
      run: pip install -v -e ".[docs]"

    - name: Report sphinx version
      run: |
        python -c "import sphinx; print('sphinx ==', sphinx.__version__)"

    - name: Build HTML docs
      ## -W turns warnings into errors so missing references/refs surface in CI.
      ## -b html picks the HTML builder; output lands under docs/_build/html.
      run: sphinx-build -W -b html docs docs/_build/html

    - name: Upload built HTML as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        retention-days: 7
