# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the build environment.
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Build documentation with Sphinx in the docs/ directory.
sphinx:
  configuration: docs/conf.py
  # Fail the build on any warning so drift is caught early.
  fail_on_warning: false

# Optionally build additional formats.
formats:
  - htmlzip

# Install the package plus the [docs] extra so autodoc can import modules
# and Sphinx/theme/myst-parser are available. Heavy runtime deps (torch,
# opencv, decord, ...) are additionally listed in autodoc_mock_imports
# inside docs/conf.py as a safety net in case the RTD builder cannot
# install them (e.g. timeout / OOM on the free tier).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
